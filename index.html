<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>CargaFácil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50:'#FBF8EE',100:'#F5EECB',200:'#EADF8F',300:'#DECE54',
              400:'#D4AF37',500:'#C49B30',600:'#A8822B',700:'#7D6420',
              800:'#524515',900:'#2A240D'
            },
            escuro: { 50:'#2A2A2A',100:'#1F1F1F',800:'#141414',900:'#0A0A0A' },
            claro: { 50:'#FEFEFE',100:'#FAFAFA',200:'#F0F0F0',300:'#E0E0E0' }
          },
          fontFamily: { display:['Playfair Display','serif'], body:['Source Sans 3','sans-serif'] },
          boxShadow: {
            card:'0 1px 3px rgba(10,10,10,0.06),0 1px 2px rgba(10,10,10,0.04)',
            cardHover:'0 4px 12px rgba(10,10,10,0.1),0 2px 4px rgba(10,10,10,0.06)',
            lift:'0 8px 24px rgba(10,10,10,0.12),0 4px 8px rgba(10,10,10,0.06)',
            nav:'0 -2px 12px rgba(10,10,10,0.08)'
          },
          borderRadius: { app:'24px' }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Source Sans 3', sans-serif; background: #1a1a1a; display:flex; justify-content:center; min-height:100vh; margin:0; padding:0; }

    @keyframes fadeSlideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    [data-tela]:not(.hidden) { animation: fadeSlideIn .28s ease-out both; }
    .ativo { color: #D4AF37 !important; }
    .ativo svg { stroke: #D4AF37 !important; }

    .scrollbar-subtle::-webkit-scrollbar { width: 3px; }
    .scrollbar-subtle::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-subtle::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }

    :focus-visible { outline: 2px solid #D4AF37; outline-offset: 2px; border-radius: 6px; }

    .badge { display:inline-flex; align-items:center; padding: 2px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; line-height: 20px; letter-spacing: 0.01em; }
    .badge-ok { background: #ECFDF5; color: #065F46; }
    .badge-erro { background: #FEF2F2; color: #991B1B; }
    .badge-info { background: #FBF8EE; color: #7D6420; }
    .badge-aviso { background: #FFF7ED; color: #9A3412; }

    .card { background: #FAFAFA; border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(10,10,10,0.06),0 1px 2px rgba(10,10,10,0.04); border: 1px solid rgba(212,175,55,0.08); transition: box-shadow .2s ease, transform .15s ease; }
    .card-interactive:hover { box-shadow: 0 4px 12px rgba(10,10,10,0.1),0 2px 4px rgba(10,10,10,0.06); transform: translateY(-1px); }
    .card-interactive:active { transform: scale(0.985); }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 24px; border-radius:12px; font-weight:600; font-size:14px; font-family:'Source Sans 3',sans-serif; cursor:pointer; border:none; transition: all .15s ease; white-space:nowrap; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background:#0A0A0A; color:#FAFAFA; }
    .btn-primary:hover { background:#1a1a1a; box-shadow: 0 4px 12px rgba(10,10,10,0.25); }
    .btn-gold { background:#D4AF37; color:#0A0A0A; }
    .btn-gold:hover { background:#C49B30; box-shadow: 0 4px 12px rgba(212,175,55,0.3); }
    .btn-outline { background:transparent; color:#0A0A0A; border:1.5px solid #0A0A0A; }
    .btn-outline:hover { background:#0A0A0A; color:#FAFAFA; }
    .btn-ghost { background:transparent; color:#0A0A0A; }
    .btn-ghost:hover { background:rgba(10,10,10,0.04); }
    .btn-danger { background:#EF4444; color:#fff; }
    .btn-danger:hover { background:#DC2626; }
    .btn-sm { padding:8px 16px; font-size:13px; border-radius:10px; }
    .btn-block { width:100%; }

    #toast-container { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; width:90%; max-width:360px; }
    .toast { pointer-events:auto; padding:12px 16px; border-radius:12px; font-size:13px; font-weight:600; font-family:'Source Sans 3',sans-serif; display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(10,10,10,0.18); animation: fadeSlideIn .3s ease-out both; backdrop-filter: blur(8px); }
    .toast-ok { background:rgba(6,95,70,0.92); color:#fff; }
    .toast-erro { background:rgba(153,27,27,0.92); color:#fff; }
    .toast-info { background:rgba(10,10,10,0.92); color:#FAFAFA; }
    .toast.fade-out { opacity:0; transform:translateY(-8px); transition: all .3s ease; }

    #modal-overlay { position:fixed; inset:0; background:rgba(10,10,10,0.6); z-index:5000; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
    #modal-overlay.aberto { display:flex; }
    #modal-card { background:#FAFAFA; border-radius:24px 24px 0 0; width:100%; max-width:430px; max-height:85vh; display:flex; flex-direction:column; animation: slideUp .25s ease-out; }
    @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

    @media (min-width: 431px) {
      .phone-frame { border-radius: 32px; border: 3px solid #2A2A2A; overflow: hidden; }
      #modal-overlay { align-items:center; }
      #modal-card { border-radius: 24px; max-height: 80vh; }
      #toast-container { left: calc(50% - 195px); }
    }
  </style>
</head>
<body class="bg-neutral-900">

  <!-- ===== CONTAINER DO APP ===== -->
  <div id="app" class="phone-frame relative bg-marca-100 w-full max-w-[390px] h-screen max-h-[844px] overflow-hidden flex flex-col shadow-2xl">

    <!-- BARRA DE STATUS -->
    <div class="bg-escuro-900 text-claro-100 flex items-center justify-between px-6 pt-2 pb-1 select-none flex-shrink-0" style="height:44px">
      <span id="status-hora" class="text-sm font-semibold tracking-wide"></span>
      <div class="flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3C7.46 3 3.34 4.78.29 7.67l1.45 1.45C4.87 7.54 8.34 6 12 6s7.13 1.54 9.26 4.12l1.45-1.45C20.66 4.78 16.54 3 12 3zm0 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c1.08 0 2.09-.29 2.97-.76L15 19.17A5.96 5.96 0 0 1 12 21c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.08 0 2.09.29 2.97.76L9 8.83A5.96 5.96 0 0 1 12 7c3.31 0 6 2.69 6 6s-2.69 6-6 6c-1.08 0-2.09-.29-2.97-.76L11 14.17A5.96 5.96 0 0 1 12 15c3.31 0 6-2.69 6-6s-2.69-6-6-6z"/></svg>
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg class="w-5 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.33-.6 1.33-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </div>

    <!-- CABEÇALHO DO APP -->
    <header class="bg-escuro-900 px-5 pb-4 pt-2 flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="flex-shrink-0">
          <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="34" height="34" rx="10" fill="#0A0A0A" stroke="#D4AF37" stroke-width="2"/>
            <path d="M19 12L12 20h14l-7-8z" fill="#D4AF37" opacity="0.9"/>
            <rect x="14" y="20" width="10" height="6" rx="2" fill="#D4AF37" opacity="0.5"/>
          </svg>
        </div>
        <div>
          <h1 class="font-display text-claro-100 text-xl font-bold tracking-tight leading-none">Carga<span class="text-marca-400">Fácil</span></h1>
          <p class="text-claro-300 text-[11px] font-body font-medium tracking-wide uppercase mt-0.5 opacity-70">Sistema de Gestão</p>
        </div>
      </div>
    </header>

    <!-- ÁREA DE TELAS -->
    <main id="main-content" class="flex-1 overflow-y-auto scrollbar-subtle bg-marca-100 relative">
      <!-- TELAS -->
    </main>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="bg-escuro-900 border-t border-white/5 flex-shrink-0 relative z-50">
      <div class="h-[3px] w-full" style="background: linear-gradient(90deg, transparent 0%, #D4AF37 30%, #D4AF37 70%, transparent 100%); opacity:.6;"></div>
      <div class="flex items-stretch">
        <button data-nav="painel-inicial" onclick="mostrarTela('painel-inicial')" class="ativo flex-1 flex flex-col items-center justify-center gap-[3px] py-2 text-[11px] font-semibold transition-colors duration-200 text-claro-300 hover:text-marca-400" aria-label="Painel Inicial">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Início
        </button>
        <button data-nav="novo-pedido" onclick="mostrarTela('novo-pedido')" class="flex-1 flex flex-col items-center justify-center gap-[3px] py-2 text-[11px] font-semibold transition-colors duration-200 text-claro-300 hover:text-marca-400" aria-label="Novo Pedido">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Pedido
        </button>
        <button data-nav="orcamentos" onclick="mostrarTela('orcamentos')" class="flex-1 flex flex-col items-center justify-center gap-[3px] py-2 text-[11px] font-semibold transition-colors duration-200 text-claro-300 hover:text-marca-400" aria-label="Orçamentos">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Orçam.
        </button>
        <button data-nav="controle-financeiro" onclick="mostrarTela('controle-financeiro')" class="flex-1 flex flex-col items-center justify-center gap-[3px] py-2 text-[11px] font-semibold transition-colors duration-200 text-claro-300 hover:text-marca-400" aria-label="Controle Financeiro">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Financeiro
        </button>
        <button data-nav="notificacoes" onclick="mostrarTela('notificacoes')" class="flex-1 flex flex-col items-center justify-center gap-[3px] py-2 text-[11px] font-semibold transition-colors duration-200 text-claro-300 hover:text-marca-400 relative" aria-label="Notificações">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="nav-notif-dot" class="absolute top-1 right-3 w-2 h-2 bg-marca-400 rounded-full hidden"></span>
          Alertas
        </button>
      </div>
    </nav>
  </div>

  <!-- ===== UTILITÁRIOS GLOBAIS ===== -->

  <!-- TOASTS -->
  <div id="toast-container"></div>

  <!-- MODAL -->
  <div id="modal-overlay" onclick="if(event.target===this)fecharModal()">
    <div id="modal-card">
      <div class="flex items-center justify-between p-5 pb-3 border-b border-claro-300">
        <h3 id="modal-titulo" class="font-display text-lg font-bold text-escuro-900"></h3>
        <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-claro-300 transition-colors" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-conteudo" class="p-5 overflow-y-auto scrollbar-subtle flex-1"></div>
    </div>
  </div>

  <script>
    // ===== ROTEADOR =====
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function(s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function(b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      document.getElementById('main-content').scrollTop = 0;
    }

    // ===== TOASTS =====
    var toastTimers = [];
    function toast(mensagem, tipo) {
      toastTimers.forEach(function(t) { clearTimeout(t.id); });
      var container = document.getElementById('toast-container');
      container.innerHTML = '';
      var el = document.createElement('div');
      el.className = 'toast toast-' + (tipo || 'info');
      var icones = { ok:'✓', erro:'✕', info:'ℹ' };
      el.innerHTML = '<span style="font-size:16px;flex-shrink:0">' + (icones[tipo]||'ℹ') + '</span><span>' + mensagem + '</span>';
      container.appendChild(el);
      var tid = setTimeout(function() {
        el.classList.add('fade-out');
        setTimeout(function(){ el.remove(); }, 300);
      }, 3000);
      toastTimers.push({ id: tid });
    }

    // ===== MODAL =====
    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-conteudo').innerHTML = html;
      document.getElementById('modal-overlay').classList.add('aberto');
    }
    function fecharModal() {
      document.getElementById('modal-overlay').classList.remove('aberto');
    }
    document.addEventListener('keydown', function(e) { if(e.key === 'Escape') fecharModal(); });

    // ===== UTILITÁRIOS =====
    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function dataBR(iso) {
      if (!iso) return '—';
      var d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('pt-BR');
    }
    function statusBadge(texto, tipo) {
      return '<span class="badge badge-' + (tipo || 'info') + '">' + texto + '</span>';
    }
    function iniciais(nome) {
      return nome.split(' ').map(function(p){ return p[0]; }).join('').substring(0,2).toUpperCase();
    }
    function corAvatar(nome) {
      var cores = ['#D4AF37','#2563EB','#059669','#DC2626','#7C3AED','#DB2777','#0891B2','#EA580C'];
      var h = 0; for(var i=0;i<nome.length;i++) h = (h + nome.charCodeAt(i)*7) % cores.length;
      return cores[h];
    }
    function avatarSVG(nome, tamanho) {
      var s = tamanho || 36;
      return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'"><rect width="'+s+'" height="'+s+'" rx="'+(s/2)+'" fill="'+corAvatar(nome)+'"/><text x="'+(s/2)+'" y="'+(s/2+s*0.32)+'" text-anchor="middle" fill="#FAFAFA" font-size="'+(s*0.42)+'" font-weight="700" font-family="Source Sans 3, sans-serif">'+iniciais(nome)+'</text></svg>';
    }
    function atualizarHora() {
      var agora = new Date();
      document.getElementById('status-hora').textContent = agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }
    atualizarHora(); setInterval(atualizarHora, 30000);
    var _id = 0;
    function uid() { return 'el-' + (++_id); }

    document.addEventListener('DOMContentLoaded', function() { mostrarTela('painel-inicial'); });
  </script>

</body>
</html>
